# Fait lire a ComfyUI les modeles stockes sur le volume RunPod.
# Sur un endpoint Serverless, le volume (Network ou Global) est monte sur /runpod-volume.
runpod_volume:
  base_path: /runpod-volume/models
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
  latent_upscale_models: latent_upscale_models
  loras: loras
  checkpoints: checkpoints
